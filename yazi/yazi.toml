# ~/.config/yazi/yazi.toml
# Optimized for Kitty + TUI/CLI workflow

[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
sort_translit  = true
linemode       = "size_and_mtime"
show_hidden    = false
show_symlink   = true
scrolloff      = 8
mouse_events   = ["click", "scroll", "drag"]
title_format   = "Yazi: {cwd}"

[preview]
wrap          = "yes"
tab_size      = 2
max_width     = 1200
max_height    = 1500
image_delay   = 30
image_filter  = "lanczos3"
image_quality = 80
cache_dir     = ""

[opener]
# Text / code → Neovim (block so Yazi waits)
edit = [
	{ run = 'nvim "$@"', desc = "nvim", block = true, for = "unix" },
]
# Video / audio → mpv (orphan = detach, don't block Yazi)
play = [
	{ run = 'mpv --force-window=immediate "$@"', desc = "mpv", orphan = true, for = "unix" },
]
# Images → imv
image = [
	{ run = 'imv "$@"', desc = "imv", orphan = true, for = "unix" },
]
# Generic desktop open
open = [
	{ run = 'xdg-open "$@"', desc = "xdg-open", orphan = true, for = "unix" },
]
reveal = [
	{ run = 'xdg-open "$(dirname "$1")"', desc = "Reveal", orphan = true, for = "unix" },
]
# Archives → extract with ouch (CLI, no plugin needed)
extract = [
	{ run = 'ouch decompress "$@"', desc = "Extract (ouch)", block = true, for = "unix" },
]
hex = [
	{ run = 'hexyl "$@"', desc = "hexyl", block = true, for = "unix" },
]
lazygit = [
	{ run = 'lazygit', desc = "lazygit", block = true, for = "unix" },
]

[open]
# First matching rule wins. Order matters.
prepend_rules = [
	# Images → imv
	{ mime = "image/*", use = ["image", "open"] },
	# Video / audio → mpv
	{ mime = "{audio,video}/*", use = ["play", "open"] },
	# Archives → extract
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = ["extract", "open"] },
	{ url = "*.{zip,tar,gz,tgz,bz2,xz,7z,rar,zst}", use = ["extract", "open"] },
	# PDF
	{ mime = "application/pdf", use = ["open"] },
	# Text / code → nvim
	{ mime = "text/*", use = ["edit"] },
	{ mime = "application/json", use = ["edit"] },
	{ mime = "application/javascript", use = ["edit"] },
	{ mime = "application/x-*-script", use = ["edit"] },
	{ url = "*.{lua,toml,yml,yaml,md,json,nix,qml,conf,ini,css,scss,html,rs,go,c,h,cpp,hpp,py,sh,bash,fish}", use = ["edit"] },
	# Fallback
	{ url = "*", use = ["open", "edit"] },
]

[plugin]
# Previewers (first match wins). No ouch.yazi plugin required —
# use piper + the ouch CLI binary instead.
prepend_previewers = [
	# Markdown → glow
	{ url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },
	# Directories → eza tree
	{ url = "*/", run = 'piper -- eza -TL=3 --color=always --icons --group-directories-first --git --no-user --no-time --no-permissions "$1"' },
	# Archives → ouch list (CLI, not the plugin)
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", run = 'piper -- ouch list "$1"' },
	{ url = "*.{zip,tar,gz,tgz,bz2,xz,7z,rar,zst}", run = 'piper -- ouch list "$1"' },
	# Binary / unknown → hexyl
	{ mime = "application/octet-stream", run = 'piper -- hexyl --border none "$1"' },
]

prepend_fetchers = [
	{ id = "git", url = "*",  run = "git", group = "git" },
	{ id = "git", url = "*/", run = "git", group = "git" },
]

[tasks]
micro_workers = 10
macro_workers = 25
bizarre_retry = 3
image_alloc   = 536870912  # 512 MB
